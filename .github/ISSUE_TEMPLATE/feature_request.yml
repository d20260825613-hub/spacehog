name: Feature request
description: Suggest a question spacehog should answer
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        spacehog answers "where did my disk space go?" and it is intentionally
        **report-only** — it never deletes, moves or modifies files. Requests to
        add a delete/move action will be closed, but ideas that make the report
        more useful are very welcome.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to find out?
      description: Describe the question, not the implementation.
      placeholder: I want to know which of several duplicate copies is the one I should keep.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: How might it look?
      description: Sketch the flag and the output you would expect, if you have one in mind.
      render: shell
      placeholder: spacehog . --suggest-keep
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: What do you use today?
      description: Other tools or scripts, and why they fall short.
    validations:
      required: false

  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      options:
        - label: This can be done without adding a runtime dependency
          required: false
        - label: This keeps spacehog report-only (no deleting or moving files)
          required: false
